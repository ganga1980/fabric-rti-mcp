name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="latest"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAG="dev-latest"
          else
            TAG="pr-${{ github.event.pull_request.number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ steps.image-tag.outputs.tag }}
            ${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Scan image for vulnerabilities
        run: |
          # Install Trivy
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

          # Scan the image
          trivy image --severity HIGH,CRITICAL \
            ${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ steps.image-tag.outputs.tag }}

  deploy-dev:
    name: Deploy to Development
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Update image tag in kustomization
        run: |
          cd deployment/kubernetes/overlays/dev
          kustomize edit set image fabric-rti-mcp=${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ needs.build.outputs.image-tag }}

      - name: Deploy to development
        run: |
          kubectl apply -k deployment/kubernetes/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fabric-rti-mcp-dev -n fabric-rti-mcp-dev --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n fabric-rti-mcp-dev
          kubectl get svc -n fabric-rti-mcp-dev

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Update image tag in kustomization
        run: |
          cd deployment/kubernetes/overlays/staging
          kustomize edit set image fabric-rti-mcp=${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ needs.build.outputs.image-tag }}

      - name: Deploy to staging
        run: |
          kubectl apply -k deployment/kubernetes/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fabric-rti-mcp-staging -n fabric-rti-mcp-staging --timeout=300s

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 10

          # Port forward and test health endpoint
          kubectl port-forward -n fabric-rti-mcp-staging svc/fabric-rti-mcp-staging 8080:80 &
          PF_PID=$!
          sleep 5

          # Test health endpoint
          RESPONSE=$(curl -s http://localhost:8080/health)
          echo "Health check response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "healthy"; then
            echo "✅ Smoke test passed"
          else
            echo "❌ Smoke test failed"
            kill $PF_PID
            exit 1
          fi

          kill $PF_PID

  deploy-prod:
    name: Deploy to Production
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Update image tag in kustomization
        run: |
          cd deployment/kubernetes/overlays/prod
          kustomize edit set image fabric-rti-mcp=${{ env.ACR_NAME }}.azurecr.io/fabric-rti-mcp:${{ needs.build.outputs.image-tag }}

      - name: Deploy to production
        run: |
          kubectl apply -k deployment/kubernetes/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fabric-rti-mcp-prod -n fabric-rti-mcp-prod --timeout=600s

      - name: Verify deployment
        run: |
          kubectl get pods -n fabric-rti-mcp-prod
          kubectl get hpa -n fabric-rti-mcp-prod
          kubectl get pdb -n fabric-rti-mcp-prod

      - name: Create deployment annotation
        run: |
          kubectl annotate deployment/fabric-rti-mcp-prod -n fabric-rti-mcp-prod \
            deployment.kubernetes.io/revision="${{ github.sha }}" \
            deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
            deployment.kubernetes.io/deployed-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite
