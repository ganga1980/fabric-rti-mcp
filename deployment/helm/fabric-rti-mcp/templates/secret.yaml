{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fabric-rti-mcp.secretName" . }}
  labels:
    {{- include "fabric-rti-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.config.auth.method "obo" }}
  # OBO Flow secrets
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "tenantId") }}
  FABRIC_RTI_MCP_AZURE_TENANT_ID: {{ .Values.secrets.obo.tenantId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "entraAppClientId") }}
  FABRIC_RTI_MCP_ENTRA_APP_CLIENT_ID: {{ .Values.secrets.obo.entraAppClientId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "userManagedIdentityClientId") }}
  FABRIC_RTI_MCP_USER_MANAGED_IDENTITY_CLIENT_ID: {{ .Values.secrets.obo.userManagedIdentityClientId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "kustoAudience") }}
  FABRIC_RTI_MCP_KUSTO_AUDIENCE: {{ .Values.secrets.obo.kustoAudience | quote }}
  {{- end }}
  {{- else if eq .Values.config.auth.method "workloadIdentity" }}
  # Workload Identity with OBO
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "tenantId") }}
  FABRIC_RTI_MCP_AZURE_TENANT_ID: {{ .Values.secrets.obo.tenantId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "entraAppClientId") }}
  FABRIC_RTI_MCP_ENTRA_APP_CLIENT_ID: {{ .Values.secrets.obo.entraAppClientId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "userManagedIdentityClientId") }}
  FABRIC_RTI_MCP_USER_MANAGED_IDENTITY_CLIENT_ID: {{ .Values.secrets.obo.userManagedIdentityClientId | quote }}
  {{- end }}
  {{- if and .Values.secrets.obo (hasKey .Values.secrets.obo "kustoAudience") }}
  FABRIC_RTI_MCP_KUSTO_AUDIENCE: {{ .Values.secrets.obo.kustoAudience | quote }}
  {{- end }}
  {{- else if eq .Values.config.auth.method "servicePrincipal" }}
  # Service Principal secrets
  {{- if and .Values.secrets.servicePrincipal (hasKey .Values.secrets.servicePrincipal "clientId") }}
  AZURE_CLIENT_ID: {{ .Values.secrets.servicePrincipal.clientId | quote }}
  {{- end }}
  {{- if and .Values.secrets.servicePrincipal (hasKey .Values.secrets.servicePrincipal "clientSecret") }}
  AZURE_CLIENT_SECRET: {{ .Values.secrets.servicePrincipal.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.secrets.servicePrincipal (hasKey .Values.secrets.servicePrincipal "tenantId") }}
  AZURE_TENANT_ID: {{ .Values.secrets.servicePrincipal.tenantId | quote }}
  {{- end }}
  {{- end }}

  {{- with .Values.secrets.extraSecrets }}
  # Additional secrets
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
