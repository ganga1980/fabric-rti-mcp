apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fabric-rti-mcp-prod

# Base resources
resources:
  - namespace.yaml
  - ../../base

# Common labels for production environment
labels:
  - pairs:
      environment: production
      app.kubernetes.io/instance: fabric-rti-mcp-prod

# Images configuration for production
images:
  - name: fabric-rti-mcp
    newName: your-acr.azurecr.io/fabric-rti-mcp
    newTag: v0.2.0  # Use specific version tags in production

# Replicas configuration for production
replicas:
  - name: fabric-rti-mcp
    count: 3

# ConfigMap overrides for production environment
configMapGenerator:
  - name: fabric-rti-mcp-config
    behavior: merge
    literals:
      - FABRIC_RTI_STATELESS_HTTP=true
      - USE_OBO_FLOW=true

# Patches for production environment
patches:
  # Full resources for production
  - target:
      kind: Deployment
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m

  # Update ingress host for production
  - target:
      kind: Ingress
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fabric-rti-mcp.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fabric-rti-mcp.example.com

  # Production-grade HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Production PDB - require more pods available
  - target:
      kind: PodDisruptionBudget
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2

  # Enable workload identity label
  - target:
      kind: Deployment
      name: fabric-rti-mcp
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"

  # Add node affinity for production nodes
  - target:
      kind: Deployment
      name: fabric-rti-mcp
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: workload
                  operator: In
                  values:
                  - production
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                    - fabric-rti-mcp
                topologyKey: kubernetes.io/hostname
