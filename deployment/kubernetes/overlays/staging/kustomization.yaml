apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fabric-rti-mcp-staging

# Base resources
bases:
  - ../../base

# Suffix for resources
nameSuffix: -staging

# Common labels for staging environment
commonLabels:
  environment: staging
  app.kubernetes.io/instance: fabric-rti-mcp-staging

# Images configuration for staging
images:
  - name: fabric-rti-mcp
    newName: your-acr.azurecr.io/fabric-rti-mcp
    newTag: staging-latest

# Replicas configuration for staging
replicas:
  - name: fabric-rti-mcp
    count: 2

# ConfigMap overrides for staging environment
configMapGenerator:
  - name: fabric-rti-mcp-config
    behavior: merge
    literals:
      - FABRIC_RTI_STATELESS_HTTP=true
      - USE_OBO_FLOW=true

# Patches for staging environment
patches:
  # Moderate resources for staging
  - target:
      kind: Deployment
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 750m

  # Update ingress host for staging
  - target:
      kind: Ingress
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fabric-rti-mcp-staging.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fabric-rti-mcp-staging.example.com

  # Adjust HPA for staging
  - target:
      kind: HorizontalPodAutoscaler
      name: fabric-rti-mcp
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6

  # Enable workload identity label
  - target:
      kind: Deployment
      name: fabric-rti-mcp
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
