apiVersion: v1
kind: ConfigMap
metadata:
  name: fabric-rti-mcp-config
  labels:
    app.kubernetes.io/name: fabric-rti-mcp
    app.kubernetes.io/component: config
data:
  # Transport configuration
  FABRIC_RTI_TRANSPORT: "http"
  FABRIC_RTI_HTTP_HOST: "0.0.0.0"
  FABRIC_RTI_HTTP_PORT: "3000"
  FABRIC_RTI_HTTP_PATH: "/mcp"
  FABRIC_RTI_STATELESS_HTTP: "true"

  # Fabric API configuration
  FABRIC_API_BASE: "https://api.fabric.microsoft.com/v1"
  FABRIC_BASE_URL: "https://fabric.microsoft.com"

  # OBO Flow configuration (set to true when using workload identity)
  USE_OBO_FLOW: "false"

  # Optional: AI Foundry compatibility
  FABRIC_RTI_AI_FOUNDRY_COMPATIBILITY_SCHEMA: "false"

  # Optional: Kusto default configuration (can be overridden per request)
  # KUSTO_SERVICE_URI: "https://help.kusto.windows.net/"
  # KUSTO_SERVICE_DEFAULT_DB: "Samples"
