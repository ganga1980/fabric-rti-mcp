apiVersion: v1
kind: Secret
metadata:
  name: fabric-rti-mcp-secrets
  namespace: fabric-rti-mcp
  labels:
    app.kubernetes.io/name: fabric-rti-mcp
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # OBO Flow secrets (only needed if USE_OBO_FLOW=true)
  # Uncomment and populate when using OBO authentication
  # FABRIC_RTI_MCP_AZURE_TENANT_ID: "your-tenant-id"
  # FABRIC_RTI_MCP_ENTRA_APP_CLIENT_ID: "your-entra-app-client-id"
  # FABRIC_RTI_MCP_USER_MANAGED_IDENTITY_CLIENT_ID: "your-umi-client-id"
  # FABRIC_RTI_MCP_KUSTO_AUDIENCE: "https://kusto.kusto.windows.net"

  # Service Principal secrets (alternative auth method)
  # AZURE_CLIENT_ID: "your-sp-client-id"
  # AZURE_CLIENT_SECRET: "your-sp-client-secret"
  # AZURE_TENANT_ID: "your-tenant-id"
