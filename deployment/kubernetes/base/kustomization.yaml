apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fabric-rti-mcp

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: fabric-rti-mcp

# Images configuration
images:
  - name: fabric-rti-mcp
    newName: your-acr.azurecr.io/fabric-rti-mcp  # Replace with your ACR
    newTag: latest

# ConfigMap generator for additional configurations
# configMapGenerator:
#   - name: fabric-rti-mcp-config
#     behavior: merge
#     literals:
#       - CUSTOM_CONFIG=value

# Secret generator (use for non-sensitive defaults)
# secretGenerator:
#   - name: fabric-rti-mcp-secrets
#     behavior: merge
#     literals:
#       - PLACEHOLDER=value
